name: Repository Activity Heartbeat

# GitHub automatically disables scheduled workflows in public repositories
# after 60 days without repository activity. Keep this automation repository
# active independently from the Supabase keep-alive below.
on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repository-activity-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record monthly repository activity
        run: |
          set -euo pipefail

          today=$(date -u +%F)
          activity_file=.github/repository-activity.txt

          if [ -f "$activity_file" ] && grep -Fqx "$today" "$activity_file"; then
            echo "Repository activity already recorded for $today"
            exit 0
          fi

          printf '%s\n' "$today" > "$activity_file"
          git config user.name "flight-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$activity_file"
          git commit -m "維運：更新儲存庫活動日期 [skip ci]"
          git push
