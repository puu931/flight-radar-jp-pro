name: Flight Scan

on:
  schedule:
    # All times UTC. JST = UTC + 9.
    - cron: "0 0 * * *"   # 09:00 JST
    - cron: "0 6 * * *"   # 15:00 JST
    - cron: "0 14 * * *"  # 23:00 JST
  workflow_dispatch: {}

jobs:
  scan:
    # Playwright 1.48 supports Ubuntu 22.04; avoid ubuntu-latest image migrations.
    runs-on: ubuntu-22.04
    # Exact-date CTS monitoring adds dozens of browser-backed searches per run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Validate runtime configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          FLIGHT_SOURCES: ${{ vars.FLIGHT_SOURCES }}
        run: |
          set -euo pipefail

          missing=()
          for name in DATABASE_URL DISCORD_WEBHOOK_URL FLIGHT_SOURCES; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required runtime configuration: ${missing[*]}"
            exit 1
          fi

          normalised_sources=$(printf '%s' "$FLIGHT_SOURCES" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          case ",$normalised_sources," in
            *,travelpayouts,*)
              [ -n "${TRAVELPAYOUTS_TOKEN:-}" ] || {
                echo "TRAVELPAYOUTS_TOKEN is required when FLIGHT_SOURCES includes travelpayouts"
                exit 1
              }
              ;;
          esac
          case ",$normalised_sources," in
            *,mock,*)
              echo "FLIGHT_SOURCES must not include the synthetic mock source"
              exit 1
              ;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:////tmp/flight-radar-tests.db
          FLIGHT_SOURCES: mock
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright installation failed after 3 attempts"
              exit 1
            fi
            echo "Playwright installation failed; retrying in 10 seconds (attempt $attempt/3)"
            sleep 10
          done

      - name: Run scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FLIGHT_SOURCES: ${{ vars.FLIGHT_SOURCES }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scan.py
